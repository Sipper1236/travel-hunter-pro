name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check:markdown-links
      - run: npm run test:ci
        env:
          API_ANYTHING_BROWSER: /usr/bin/google-chrome
      - run: npm run build
